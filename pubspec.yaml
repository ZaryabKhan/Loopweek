name: loopweek
description: "Loopweek — a free, open-source weekly to-do app for Android. One screen, seven days, nothing else."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local storage
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1

  # IDs
  uuid: ^4.4.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Home screen widget (Android App Widget)
  home_widget: ^0.7.0+1

  # Settings / preferences
  shared_preferences: ^2.3.2

  # Misc
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true