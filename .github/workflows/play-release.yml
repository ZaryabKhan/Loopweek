name: Play Release

# Builds the playstore-flavor AAB and uploads it to the Google Play
# INTERNAL track. Manual trigger only — nothing is promoted to
# production from this lane.
#
# One-time setup required:
#   Add this repository secret (Settings -> Secrets and variables -> Actions):
#     PLAY_SERVICE_ACCOUNT_JSON – full JSON key of the Play Developer API
#     service account, already granted release access to the app.
#
# The AAB is signed with the debug keystore (android/key.properties does not
# exist in CI). Google Play App Signing re-signs with the real app key, so
# the internal track accepts it.

on:
  workflow_dispatch:   # manual only; attach a tag trigger when release tagging is unlocked

permissions:
  contents: read

jobs:
  play-release:
    name: Build AAB & Upload to Internal Track
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build signed release AAB (playstore flavor)
        run: flutter build appbundle --flavor playstore --dart-define=DONATION_MODE=iap --release

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.appcodecraft.loopweek
          releaseFiles: build/app/outputs/bundles/release/app-release.aab
          track: internal
          status: completed
