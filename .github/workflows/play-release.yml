name: Play Release

# Builds the playstore-flavor AAB, signs it with the Play upload key
# (PLAY_KEYSTORE_* secrets, written to android/key.properties), and
# uploads it to the Google Play PRODUCTION track with full rollout
# (owner-ordered). The GitHub-release lane (RELEASE_* keystore) stays
# untouched in release.yml.

on:
  workflow_dispatch:   # manual only; attach a tag trigger when release tagging is unlocked

permissions:
  contents: read

jobs:
  play-release:
    name: Build AAB & Upload to Internal Track
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write Play signing config from secrets
        run: |
          echo "${{ secrets.PLAY_KEYSTORE_BASE64 }}" | base64 -d > android/app/play-upload.keystore
          cat > android/key.properties <<'EOF'
          storeFile=play-upload.keystore
          storePassword=${{ secrets.PLAY_STORE_PASSWORD }}
          keyAlias=${{ secrets.PLAY_KEY_ALIAS }}
          keyPassword=${{ secrets.PLAY_KEY_PASSWORD }}
          EOF

      - name: Build signed release AAB (playstore flavor)
        run: flutter build appbundle --flavor playstore --dart-define=DONATION_MODE=iap --release

      - name: Upload to Google Play (production track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.appcodecraft.loopweek
          releaseFiles: build/app/outputs/bundle/playstoreRelease/app-playstore-release.aab
          track: production
          status: completed
