# Heavy builds run here on GitHub Actions (free for public repos).
# Artifacts are UNSIGNED — download and sign locally with the loopweek-test key
# via apksigner. Production releases keep using release.yml / play-release.yml.

name: Build Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned release APK (github flavor)
        run: flutter build apk --flavor github --dart-define=DONATION_MODE=polar --release

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-unsigned
          path: build/app/outputs/flutter-apk/app-github-release.apk
          retention-days: 14
